name: Deploy to EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"          # docs-only changes don't need a deploy
  workflow_dispatch:     # "Run workflow" button for manual redeploys

# Never run two deploys at the same time; a newer push waits for the running one
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  id-token: write   # lets the workflow get short-lived AWS credentials (OIDC), no stored keys
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::881490130721:role/gde-anahit-github-deploy
  ECR_REPOSITORY: gde-anahit-nova-chat
  INSTANCE_ID: i-06820382fb0cfa83f

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test (app starts, pages and auth respond)
        run: |
          export DATA_DIR="$(mktemp -d)"
          python - <<'EOF'
          import app
          c = app.app.test_client()
          assert c.get("/healthz").status_code == 200, "healthz"
          assert c.get("/login").status_code == 200, "login page"
          assert c.get("/api/conversations").status_code == 401, "API must require login"
          r = c.post("/register", data={"username": "ci-user", "password": "ci-password", "confirm": "ci-password"})
          assert r.status_code == 302, f"register returned {r.status_code}"
          assert c.get("/").status_code == 200, "index after login"
          print("smoke test passed")
          EOF

  build:
    name: Build & push image
    needs: check
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - id: meta
        name: Image name
        run: |
          repo="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.repo }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://54.227.7.43
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy script on the instance (SSM)
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          # Ship the script base64-encoded so SSM doesn't touch its quotes or {{ }}
          script_b64=$(base64 -w0 deploy/remote-deploy.sh)
          params=$(jq -n --arg b64 "$script_b64" --arg image "$IMAGE" --arg region "$AWS_REGION" '{
            commands: [
              "echo \($b64) | base64 -d > /tmp/nova-deploy.sh",
              "IMAGE=\($image) AWS_REGION=\($region) bash /tmp/nova-deploy.sh"
            ],
            executionTimeout: ["900"]
          }')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7} from GitHub Actions" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          # Wait for it to finish (up to 15 minutes)
          status=Pending
          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "----- instance output -----"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          err=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text)
          [ -n "$err" ] && [ "$err" != "None" ] && { echo "----- instance errors -----"; echo "$err"; }

          echo "Final status: $status"
          [ "$status" = Success ]

      - name: Summary
        run: |
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ needs.build.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Site: http://54.227.7.43" >> "$GITHUB_STEP_SUMMARY"
