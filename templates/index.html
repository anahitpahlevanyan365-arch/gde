<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app" id="app">
    <!-- ================= Sidebar ================= -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"/></svg>
          </div>
          <span class="brand-name">Nova Chat</span>
          <button class="icon-btn close-sidebar" id="closeSidebarBtn" aria-label="Close sidebar" title="Close sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
          </button>
        </div>

        <button class="nav-item" id="newChatBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
          <span>New chat</span>
          <kbd>Ctrl ⇧ O</kbd>
        </button>

        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Search chats">
        </label>
      </div>

      <nav class="history" id="history">
        <!-- Conversation groups are rendered by app.js -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="avatar">{{ username[0] | upper }}</div>
          <span class="user-name" title="{{ username }}">{{ username }}</span>
          <form method="post" action="{{ url_for('logout') }}" class="logout-form">
            <button type="submit" class="icon-btn" aria-label="Log out" title="Log out">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            </button>
          </form>
        </div>
        <div class="model-card">
          <span class="status-dot"></span>
          <div>
            <p class="model-name">Claude via Amazon Bedrock</p>
            <p class="model-id">{{ model_id }}</p>
          </div>
        </div>
      </div>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <!-- ================= Main ================= -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn open-sidebar" id="openSidebarBtn" aria-label="Open sidebar" title="Open sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
        <button class="icon-btn open-sidebar" id="topNewChatBtn" aria-label="New chat" title="New chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <h1 class="topbar-title" id="topbarTitle">Nova Chat</h1>
        <span class="usage" id="usage"></span>
      </header>

      <section class="chat" id="chat">
        <div class="messages" id="messages"></div>
      </section>

      <div class="welcome" id="welcome">
        {% include "_robot.html" %}
        <h2>What can I help with?</h2>
      </div>

      <footer class="composer-wrap" id="composerWrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Ask anything" autocomplete="off" maxlength="{{ message_max_chars }}"></textarea>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </form>
        <div class="suggestions" id="suggestions">
          <button class="suggestion" data-prompt="Explain how large language models work in simple terms.">💡 Explain a concept</button>
          <button class="suggestion" data-prompt="Write a Python function that checks whether a string is a palindrome.">💻 Write code</button>
          <button class="suggestion" data-prompt="Give me 5 ideas for a weekend trip in Armenia.">🧭 Plan a trip</button>
          <button class="suggestion" data-prompt="Help me write a polite email asking for a deadline extension.">✉️ Draft an email</button>
        </div>
        <p class="quota" id="quota" data-limit="{{ free_limit }}" data-left="{{ messages_left }}"></p>
        <p class="hint">Nova can make mistakes. Check important info.</p>
      </footer>
    </main>
  </div>

  <!-- Conversation context menu -->
  <div class="menu" id="convMenu" role="menu">
    <button class="menu-item" data-action="rename" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      Rename
    </button>
    <button class="menu-item danger" data-action="delete" role="menuitem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
      Delete
    </button>
  </div>

  <!-- Delete confirmation dialog -->
  <div class="modal-backdrop" id="deleteModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
      <h3 id="deleteTitle">Delete chat?</h3>
      <p>This will delete <strong id="deleteName"></strong>. This can't be undone.</p>
      <div class="modal-actions">
        <button class="btn" id="cancelDelete">Cancel</button>
        <button class="btn btn-danger" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="{{ url_for('static', filename='robot.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
