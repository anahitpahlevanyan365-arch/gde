<div class="robot" aria-hidden="true">
  <svg class="robot-svg" viewBox="0 0 160 170" fill="none">
    <defs>
      <linearGradient id="robotBody" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8f82ff"/>
        <stop offset="1" stop-color="#4fd1c5"/>
      </linearGradient>
      <linearGradient id="robotShine" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="robotGlow">
        <stop offset="0" stop-color="#7ff5ea"/>
        <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Shadow on the "floor" (shrinks as the robot floats up) -->
    <ellipse class="robot-shadow" cx="80" cy="160" rx="34" ry="5" fill="#000" opacity=".35"/>

    <g class="robot-float">
      <!-- Antenna -->
      <line x1="80" y1="30" x2="80" y2="14" stroke="#9b9b9b" stroke-width="3" stroke-linecap="round"/>
      <circle class="robot-antenna-glow" cx="80" cy="11" r="11" fill="url(#robotGlow)"/>
      <circle class="robot-antenna" cx="80" cy="11" r="5" fill="#7ff5ea"/>

      <!-- Ears -->
      <rect x="27" y="52" width="10" height="22" rx="4" fill="#5b52c7"/>
      <rect x="123" y="52" width="10" height="22" rx="4" fill="#3aa89e"/>

      <!-- Head -->
      <rect x="34" y="30" width="92" height="66" rx="22" fill="url(#robotBody)"/>
      <rect x="34" y="30" width="92" height="30" rx="22" fill="url(#robotShine)"/>

      <!-- Face screen -->
      <rect x="45" y="42" width="70" height="42" rx="14" fill="#141418"/>
      <g class="robot-eyes">
        <g class="robot-eye-l"><rect x="60" y="54" width="11" height="16" rx="5.5" fill="#7ff5ea"/></g>
        <g class="robot-eye-r"><rect x="89" y="54" width="11" height="16" rx="5.5" fill="#7ff5ea"/></g>
      </g>
      <path class="robot-mouth" d="M72 76 Q80 81 88 76" stroke="#7ff5ea" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>

      <!-- Neck + body -->
      <rect x="70" y="96" width="20" height="8" rx="3" fill="#3a3a3a"/>
      <rect x="50" y="102" width="60" height="42" rx="16" fill="url(#robotBody)"/>
      <rect x="50" y="102" width="60" height="18" rx="16" fill="url(#robotShine)"/>
      <circle class="robot-heart" cx="80" cy="123" r="6" fill="#141418"/>
      <circle class="robot-heart-core" cx="80" cy="123" r="3" fill="#ff7ab6"/>

      <!-- Arms -->
      <rect x="36" y="108" width="12" height="28" rx="6" fill="#5b52c7"/>
      <g class="robot-arm-wave">
        <rect x="112" y="108" width="12" height="28" rx="6" fill="#3aa89e"/>
      </g>
    </g>
  </svg>
</div>
